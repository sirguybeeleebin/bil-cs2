version: "3.9"

services:
  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    container_name: auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - auth/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cs2_user
      POSTGRES_PASSWORD: cs2_password
      POSTGRES_DB: cs2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs2_user -d cs2_db -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "cs2_password", "--databases", "1"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cs2_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s  

  tests:
    image: python:3.11-slim
    container_name: tests
    depends_on:
      auth:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      /bin/sh -c "
      pip install --no-cache-dir poetry &&
      poetry config virtualenvs.create false &&
      poetry install --no-root --no-interaction --no-ansi &&
      poetry run pytest tests/functional --maxfail=1 --disable-warnings -v
      "

volumes:
  postgres_data:
