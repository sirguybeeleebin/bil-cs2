[tool.poetry]
name = "prediction-service"
version = "0.1.0"
description = "Сервис для ML предсказаний"
authors = ["Your Name <you@example.com>"]
package-mode = false  # <--- отключаем установку текущего проекта

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
psycopg2-binary = "*"
scikit-learn = "*"
scipy = "*"
numpy = "*"
python-dateutil = "*"
joblib = "*"
python-dotenv = "^1.2.1"
redis = "^7.0.0"
celery = "^5.5.3"
uvicorn = "^0.38.0"
fastapi = "^0.120.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-django = "*"
autoflake = "*"
isort = "*"
ruff = "*"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
