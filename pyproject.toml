[tool.poetry]
name = "prediction-service"
version = "0.1.0"
description = "Сервис для ML предсказаний"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
django = "*"
djangorestframework = "*"
djangorestframework-simplejwt = "*"
drf-spectacular = "*"
psycopg2-binary = "*"
celery = "*"
redis = "*"
channels = "*"
channels-redis = "*"
scikit-learn = "*"
scipy = "*"
numpy = "*"
python-dateutil = "*"
joblib = "*"
django-celery-beat = "^2.8.1"
httpx = "^0.28.1"
django-split-settings = "^1.3.2"
python-json-logger = "^4.0.0"

[tool.poetry.dev-dependencies]
autoflake = "*"
isort = "*"
ruff = "*"
pytest = "*"
pytest-django = "*"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
